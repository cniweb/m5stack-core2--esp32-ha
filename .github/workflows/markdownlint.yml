name: Markdown Lint

on:
  push:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/markdownlint.yml'
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/markdownlint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules
            !.pio
